name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descarca ReShade (headere + ImGui)
        run: |
          git clone --depth 1 https://github.com/crosire/reshade reshade
          git -C reshade submodule update --init --depth 1 deps/imgui
      - name: Build x64
        run: |
          cmake -S . -B build -A x64 -DRESHADE_DIR="${{ github.workspace }}/reshade"
          cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: ProShadeLite
          path: |
            build/Release/ProShadeLite.addon64
            shaders/ProShadeLite.fx
